# Checks for templates/web-app. Runs only when that template (or this file) changes.
#
# GitHub only reads workflows from the repository root, so the template's own
# `.github/workflows/ci.yml` (which projects copy) never runs here. This file is
# the same checks with the paths prefixed; keep the two in step.
name: web-app

on:
  push:
    branches: [main]
    paths: ["templates/web-app/**", ".github/workflows/web-app.yml"]
  pull_request:
    paths: ["templates/web-app/**", ".github/workflows/web-app.yml"]

permissions:
  contents: read

concurrency:
  group: web-app-${{ github.ref }}
  cancel-in-progress: true

env:
  APP: templates/web-app

jobs:
  checks:
    # Secrets are Compose secret files,
    # and every published port binds to 127.0.0.1.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/web-app
    steps:
      - uses: actions/checkout@v7
      - name: Secrets are Compose secret files
        run: python3 scripts/check_secrets.py
      - name: Every port on 127.0.0.1
        run: cp .env.example .env && python3 scripts/check_ports.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/web-app/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: templates/web-app/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc -b --force
      - name: Test
        run: npm test

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/web-app/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Ruff (lint)
        run: ruff check app tests migrations
      - name: Ruff (format)
        run: ruff format --check app tests migrations

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/web-app/backend
    services:
      # PostGIS is required: the test suite exercises real geometry columns.
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Migrations apply from scratch and match the models
        # A second database is migrated from nothing to head, then `alembic check`
        # compares the result with the models, so a model and its migration
        # cannot drift apart unnoticed.
        run: |
          PGPASSWORD=app psql -h localhost -U app -d postgres -c "CREATE DATABASE app_migrations"
          PGPASSWORD=app psql -h localhost -U app -d app_migrations -c "CREATE EXTENSION postgis"
          python -m alembic upgrade head
          python -m alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app_migrations
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: test-password
          JWT_SECRET: ci-secret-not-used-in-production
      - name: Tests (pytest) with coverage gate
        # 91% when last measured; fail if it slips below 88%.
        run: |
          python -m coverage run -m pytest
          python -m coverage report --include="app/*" --fail-under=88
        env:
          DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app_test
          # conftest.py otherwise rewrites the URL to the compose-published port.
          TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app_test
          # The suite covers user management and roles.
          MULTI_USER_ENABLED: "true"
          # The default /data/uploads is the compose volume; the runner can't create /data.
          ATTACHMENTS_DIR: ${{ runner.temp }}/uploads
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: test-password
          JWT_SECRET: ci-secret-not-used-in-production

  e2e:
    # Browser journeys (frontend/tests/e2e) against the real compose stack.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/web-app
    steps:
      - uses: actions/checkout@v7
      - name: Write a CI .env and secret files for the stack
        # Fresh random secrets in ./secrets (git-ignored), never printed; the journeys
        # read the admin password from secrets/admin_password.
        run: >-
          python3 scripts/make_env.py --set MULTI_USER_ENABLED=true --set SEED_ENABLED=false
          --set CORS_ORIGINS=http://localhost:5174 --set COOKIE_SECURE=false
      - name: Start the stack
        run: docker compose up -d --build --wait db backend frontend
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: templates/web-app/frontend/package-lock.json
      - name: Install dependencies and Chromium
        working-directory: templates/web-app/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright journeys
        working-directory: templates/web-app/frontend
        run: |
          set -a && . ../.env && set +a
          npx playwright test --reporter=line
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5174
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: templates/web-app/frontend/test-results
