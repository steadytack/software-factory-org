server {
    listen 80;
    server_tokens off;

    # Security headers for the SPA (the API sets its own, stricter set).
    # CSP: scripts only from this origin. Styles allow inline (React style
    # attributes, MapLibre). Map tiles, geocoding and imagery come from
    # third-party HTTPS hosts, and MapLibre runs its workers from blob: URLs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:; child-src blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
    # Behind a TLS-terminating proxy, enable HSTS there (or here once this
    # server itself serves HTTPS):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    # Built files have content-hashed names. One that doesn't exist is a real
    # 404, not the app page: answering a missing script with index.html (as the
    # SPA fallback below would) reaches the browser as "text/html" and breaks
    # any tab still running an older build. (`expires` rather than add_header:
    # an add_header in a location would drop the security headers above.)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # The app shell and service worker are always re-checked.
    location = /index.html {
        expires -1;
    }
    location = /sw.js {
        expires -1;
    }

    # SPA fallback: unknown paths serve index.html so React Router works on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Attachments are capped at 10 MB by the API; nginx's default (1 MB)
    # rejected most photos with a bare 413 before they reached it.
    client_max_body_size 11m;

    # Proxy API calls to the backend so cookies stay first-party.
    # X-Forwarded-For is required so uvicorn (--proxy-headers) sees the real
    # client IP — without it the login rate limiter keys every client on the
    # proxy's IP and they all share one brute-force bucket. It is SET to the
    # connecting address, not appended to: $proxy_add_x_forwarded_for keeps
    # whatever the client sent, so anyone could claim any IP and dodge the
    # limiter.
    #
    # The backend's address is looked up again through Docker's DNS (a variable
    # in proxy_pass makes nginx resolve at request time): a name resolved once at
    # startup kept the old container's address after the backend was rebuilt, and
    # every API call was a 502 until this container restarted (found in an app
    # built from this template). With no URI part, proxy_pass still sends the request's own URI.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
